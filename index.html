<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>takkupote32 Web Tools Portal</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .search-bar {
      max-width: 500px;
      margin: 1.5rem auto 0;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .status {
      text-align: center;
      color: var(--text-sub);
      margin: 2rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      word-break: break-word;
    }

    .card p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      background: #eff6ff;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-primary {
      flex: 1;
      text-align: center;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.5rem;
    }

    .btn-secondary:hover {
      color: var(--text-main);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Web Tools Portal</h1>
      <p>公開中の自作Webツール一覧</p>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ツール名や説明で検索...">
      </div>
    </header>

    <div id="status" class="status">ツール一覧を読み込み中...</div>
    <main id="toolGrid" class="grid"></main>
  </div>

  <script>
    const GITHUB_USERNAME = "takkupote32";
    const EXCLUDE_REPOS = ["takkupote32.github.io"];

    const gridEl = document.getElementById("toolGrid");
    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("searchInput");

    let allTools = [];

    async function fetchTools() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`);
        if (!response.ok) throw new Error("リポジトリの取得に失敗しました");

        const repos = await response.json();

        allTools = repos.filter(repo =>
          repo.has_pages && !EXCLUDE_REPOS.includes(repo.name.toLowerCase())
        );

        if (allTools.length === 0) {
          statusEl.textContent = "公開中のGitHub Pagesリポジトリが見つかりませんでした。";
          return;
        }

        statusEl.style.display = "none";
        renderTools(allTools);
      } catch (error) {
        statusEl.textContent = `エラー: ${error.message}`;
      }
    }

    function renderTools(tools) {
      gridEl.innerHTML = "";

      if (tools.length === 0) {
        statusEl.style.display = "block";
        statusEl.textContent = "一致するツールが見つかりません。";
        return;
      }
      statusEl.style.display = "none";

      tools.forEach(repo => {
        const pageUrl = repo.homepage && repo.homepage.startsWith("http")
          ? repo.homepage
          : `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;

        const topicsHtml = (repo.topics || [])
          .map(topic => `<span class="tag">${escapeHtml(topic)}</span>`)
          .join("");

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div>
            <h2>${escapeHtml(repo.name)}</h2>
            <p>${escapeHtml(repo.description || "説明文が設定されていません")}</p>
            ${topicsHtml ? `<div class="topics">${topicsHtml}</div>` : ""}
          </div>
          <div class="card-actions">
            <a href="${escapeHtml(pageUrl)}" target="_blank" rel="noopener noreferrer" class="btn-primary">ツールを開く</a>
            <a href="${escapeHtml(repo.html_url)}" target="_blank" rel="noopener noreferrer" class="btn-secondary">Code</a>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    searchInput.addEventListener("input", (e) => {
      const keyword = e.target.value.toLowerCase().trim();
      const filtered = allTools.filter(repo =>
        repo.name.toLowerCase().includes(keyword) ||
        (repo.description && repo.description.toLowerCase().includes(keyword)) ||
        (repo.topics && repo.topics.some(t => t.toLowerCase().includes(keyword)))
      );
      renderTools(filtered);
    });

    fetchTools();
  </script>
</body>
</html>
