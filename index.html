<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>takkupote32 | Web Tools</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-gradient: radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.08), transparent 40%),
                     radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.08), transparent 40%);
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.25);
      --border-hover: rgba(59, 130, 246, 0.5);
      --accent: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      --tag-bg: rgba(59, 130, 246, 0.1);
      --tag-text: #2563eb;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      --shadow-hover: 0 14px 28px -6px rgba(37, 99, 235, 0.14);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --bg-gradient: radial-gradient(circle at 15% 10%, rgba(59, 130, 246, 0.15), transparent 45%),
                     radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.15), transparent 45%);
      --surface: rgba(30, 41, 59, 0.75);
      --surface-solid: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #64748b;
      --border: rgba(148, 163, 184, 0.15);
      --border-hover: rgba(96, 165, 250, 0.5);
      --accent: #60a5fa;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --tag-bg: rgba(96, 165, 250, 0.15);
      --tag-text: #93c5fd;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 14px 28px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-sub);
      text-decoration: none;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-gradient);
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    /* Hero Header */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.6rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
      max-width: 540px;
      margin: 0 auto;
    }

    /* Search & Filter */
    .controls {
      max-width: 640px;
      margin: 1.75rem auto 0;
    }

    .search-wrapper {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 0.95rem;
    }

    .search-wrapper input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .search-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .filter-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip:hover,
    .filter-chip.active {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
    }

    /* Status & Grid */
    .status {
      text-align: center;
      color: var(--text-sub);
      margin: 3rem 0;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s ease,
                  border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-hover);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--tag-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .card-title-group {
      min-width: 0;
    }

    .card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .repo-slug {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.74rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .updated-date {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-code {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.15s ease;
    }

    .btn-code:hover {
      color: var(--text-main);
      border-color: var(--border-hover);
      background: var(--surface-solid);
    }

    .btn-open {
      background: var(--accent-gradient);
      color: #ffffff;
      text-decoration: none;
      padding: 0.48rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .btn-open:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    footer {
      text-align: center;
      margin-top: 4rem;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

    }
