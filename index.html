    [data-theme="dark"] {

    }

    .container {
      max-width: 1000px;
      margin: 0 auto;

    .topbar {

      margin-bottom: 2rem;
    }

    .brand {

      color: var(--text-sub);
      text-decoration: none;
    }

    .theme-btn {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    header {

      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
    }

    .search-box {
      max-width: 480px;
      margin: 1.25rem auto 0;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

      gap: 1.25rem;
      margin-top: 1.5rem;
    }
